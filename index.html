<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weapon Balls</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0e14;font-family:"Segoe UI",system-ui,sans-serif;scrollbar-width:none;}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
  canvas#game{display:block;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:#000;overflow:hidden;perspective:1200px;}
  .panel{padding:24px 32px;border-radius:20px;background:rgba(15,19,28,.93);
    border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 80px rgba(0,0,0,.65);
    backdrop-filter:blur(12px);text-align:center;color:#dfe8f5;animation:pop .35s ease;overflow:hidden;}
  #end, #pauseMenu{background:rgba(0,0,0,.6);}
  #pauseMenu{background:rgba(0,0,0,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
  #end>.panel, #pauseMenu>.panel{position:relative;background:rgba(3,10,5,.78);
    border:3px solid #1d3a24;border-radius:14px;backdrop-filter:none;
    box-shadow:0 0 44px rgba(51,255,85,.22),0 0 6px rgba(51,255,85,.08) inset,inset 0 0 60px rgba(0,0,0,.85);
    outline:1px solid rgba(51,255,85,.06);
    animation:tvFlicker 5s ease-in-out infinite;}
  #end>.panel::before, #pauseMenu>.panel::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    border-radius:12px;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.28) 2px 4px);
    animation:scanDrift 10s linear infinite;}
  #end>.panel::after, #pauseMenu>.panel::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
    border-radius:12px;
    background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(100,255,100,.012) 2px 3px),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(100,255,100,.008) 3px 5px);
    background-size:5px 5px,7px 7px;animation:staticShift .12s steps(4) infinite;}
  #end>.panel>*,#pauseMenu>.panel>*{position:relative;z-index:3;}
  #end .vf, #pauseMenu .vf{position:absolute;width:24px;height:24px;z-index:6;pointer-events:none;}
  #end .vf-tl, #pauseMenu .vf-tl{top:10px;left:10px;border-top:2px solid rgba(51,255,85,.55);border-left:2px solid rgba(51,255,85,.55);}
  #end .vf-tr, #pauseMenu .vf-tr{top:10px;right:10px;border-top:2px solid rgba(51,255,85,.55);border-right:2px solid rgba(51,255,85,.55);}
  #end .vf-bl, #pauseMenu .vf-bl{bottom:10px;left:10px;border-bottom:2px solid rgba(51,255,85,.55);border-left:2px solid rgba(51,255,85,.55);}
  #end .vf-br, #pauseMenu .vf-br{bottom:10px;right:10px;border-bottom:2px solid rgba(51,255,85,.55);border-right:2px solid rgba(51,255,85,.55);}
  #end h2, #pauseMenu h1{background:none;-webkit-background-clip:initial;background-clip:initial;color:#33ff55;
    font-size:26px;letter-spacing:8px;text-shadow:0 0 10px rgba(51,255,85,.5),0 0 30px rgba(51,255,85,.2);
    animation:titleGlow 3s ease-in-out infinite;}
  #winSub{color:#2e7a3e;}
  #pauseMenu .mbtn{background:rgba(30,80,30,.22);border:1px solid rgba(51,255,85,.22);color:#33ff55;
    border-radius:4px;letter-spacing:6px;font-size:15px;text-shadow:0 0 6px rgba(51,255,85,.35);
    box-shadow:0 0 12px rgba(51,255,85,.04);transition:all .15s;}
  #pauseMenu .mbtn::after{display:none;}
  #pauseMenu .mbtn:hover{background:rgba(51,255,85,.1);border-color:rgba(51,255,85,.5);
    box-shadow:0 0 22px rgba(51,255,85,.15);color:#55ff77;transform:translateY(-2px);}
  #pauseMenu .mbtn.alt{background:rgba(30,80,30,.1);border:1px solid rgba(51,255,85,.12);color:#28aa3a;}
  #pauseMenu .mbtn.alt:hover{background:rgba(51,255,85,.07);border-color:rgba(51,255,85,.3);color:#33ff55;}
  #end .winBtns{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  #end button{display:block;width:100%;padding:14px 18px;margin:0;border-radius:6px;cursor:pointer;
    font-size:15px;font-weight:700;letter-spacing:5px;
    background:rgba(30,80,30,.22);border:1px solid rgba(51,255,85,.22);color:#33ff55;
    text-shadow:0 0 8px rgba(51,255,85,.35);box-shadow:0 0 14px rgba(51,255,85,.05);
    transition:all .18s;position:relative;overflow:hidden;}
  #end button::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(51,255,85,.18),transparent);transform:skewX(-20deg);transition:left .45s ease;}
  #end button:hover{filter:brightness(1.25);background:rgba(51,255,85,.14);border-color:rgba(51,255,85,.6);
    color:#5dff80;box-shadow:0 0 24px rgba(51,255,85,.22);transform:translateY(-2px);}
  #end button:hover::after{left:120%;}
  #end button:active{transform:translateY(0);}
  #end button.ghost{background:rgba(30,80,30,.1);border:1px solid rgba(51,255,85,.2);color:#2fbf55;}
  #end button.ghost:hover{color:#33ff55;border-color:rgba(51,255,85,.45);}
  #end #rematch{background:linear-gradient(135deg,rgba(51,255,85,.35),rgba(30,140,60,.35));
    border:1px solid rgba(51,255,85,.65);color:#d9ffe6;box-shadow:0 0 26px rgba(51,255,85,.3),inset 0 0 18px rgba(51,255,85,.12);}
  #replayBar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;
    padding:10px 18px;border-radius:8px;background:rgba(3,10,5,.82);border:1px solid rgba(51,255,85,.4);
    box-shadow:0 0 26px rgba(51,255,85,.2),inset 0 0 18px rgba(0,0,0,.6);animation:pop .3s ease;}
  #replayBar .replayCap{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:3px;color:#33ff55;
    text-shadow:0 0 8px rgba(51,255,85,.5);}
  #replayBar .replayDot{width:9px;height:9px;border-radius:50%;background:#ff2b2b;box-shadow:0 0 7px #ff2b2b;
    animation:recPulse 1s ease-in-out infinite;}
  #skipReplay{padding:8px 18px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:3px;
    background:rgba(30,80,30,.25);border:1px solid rgba(51,255,85,.5);color:#33ff55;text-shadow:0 0 6px rgba(51,255,85,.35);
    transition:all .15s;}
  #skipReplay:hover{background:rgba(51,255,85,.18);color:#5dff80;box-shadow:0 0 18px rgba(51,255,85,.25);}
  .panel.wide{width:min(1020px,93vw);height:min(800px,93vh);display:flex;flex-direction:column;justify-content:center;
    overflow:visible;position:relative;
    background:#040a03;border:14px solid #13161a;border-radius:22px;
    box-shadow:12px 16px 50px rgba(0,0,0,.65),-2px -2px 20px rgba(0,0,0,.4),
      0 0 60px rgba(50,200,50,.06),inset 0 0 120px rgba(0,0,0,.8),
      inset 0 2px 0 rgba(255,255,255,.05),inset 0 -2px 0 rgba(0,0,0,.4),
      inset 2px 0 0 rgba(255,255,255,.02),inset -2px 0 0 rgba(0,0,0,.3);
    animation:tvFlicker 5s ease-in-out infinite;
    transform:none;transform-origin:60% 45%;
    transition:transform .15s ease-out;backdrop-filter:none;}
  .panel.wide::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:20;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.22) 2px 4px);
    animation:scanDrift 10s linear infinite;}
  .panel.wide::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:21;
    background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(100,255,100,.012) 2px 3px),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(100,255,100,.008) 3px 5px);
    background-size:5px 5px,7px 7px;animation:staticShift .12s steps(4) infinite;}
  @keyframes tvFlicker{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.96}52%{opacity:1}54%{opacity:.98}56%{opacity:1}}
  @keyframes scanDrift{to{background-position:0 40px}}
  @keyframes staticShift{0%{background-position:0 0,0 0}25%{background-position:-3px 1px,2px -1px}50%{background-position:1px -2px,-1px 3px}75%{background-position:-2px 3px,3px 1px}100%{background-position:0 0,0 0}}
  @keyframes pop{from{transform:scale(.93);opacity:0}}
  #menu{overflow:hidden}
  #menu::before,#menu::after{display:none;}
  @keyframes breathe{0%,100%{opacity:.22}50%{opacity:.42}}
  h1{margin:0;font-size:36px;letter-spacing:9px;font-weight:800;
    background:linear-gradient(90deg,#fff,#8fb0ff,#ff8a8a,#c084fc,#fff);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:titleFlow 7s linear infinite;filter:drop-shadow(0 0 18px rgba(143,176,255,.35));}
  @keyframes titleFlow{to{background-position:300% 0}}
  .sub{color:#7f93ad;font-size:11.5px;letter-spacing:2.5px;margin:8px 0 18px;text-transform:uppercase;}
  .tkSelRow{display:flex;gap:14px;align-items:stretch;justify-content:center;}
  .tkSide{flex:1;min-width:0;padding:14px 12px;border-radius:12px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
    border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;
    transition:border-color .25s,box-shadow .25s;}
  .tkSide.p1{border-color:rgba(255,93,93,.55)}
  .tkSide.p2{border-color:rgba(77,159,255,.55)}
  .tkSide.activeP{box-shadow:0 0 0 1px currentColor inset,0 0 26px rgba(255,150,80,.18);}
  .tkSide canvas{width:100%;max-width:320px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 72%);border-radius:50%;margin:4px 0 6px;}
  .tkCenter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
  .tkGrid{display:grid;grid-template-columns:repeat(5,56px);grid-auto-rows:56px;gap:7px;padding:10px;
    background:rgba(4,7,13,.72);border:1px solid rgba(255,215,130,.3);border-radius:10px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.65),0 0 20px rgba(255,215,130,.07);}
  .tkCell{position:relative;border-radius:8px;border:1px solid rgba(255,255,255,.1);cursor:pointer;
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.09),rgba(0,0,0,.42));
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:transform .12s,border-color .15s,box-shadow .15s;}
  .tkCell:hover{transform:scale(1.09);border-color:#ffd76b;box-shadow:0 0 16px rgba(255,215,107,.4);z-index:2;}
  .tkCell.selP1{border-color:#ff5d5d;box-shadow:0 0 0 2px #ff5d5d inset,0 0 14px rgba(255,93,93,.55);}
  .tkCell.selP2{border-color:#4d9fff;box-shadow:0 0 0 2px #4d9fff inset,0 0 14px rgba(77,159,255,.55);}
  .tkCell.selP1.selP2{border-color:#c084fc;box-shadow:0 0 0 2px #c084fc inset,0 0 16px rgba(192,132,252,.6);}
  .tkCell.random{border-color:rgba(125,93,255,.5);background:radial-gradient(circle at 35% 28%,rgba(125,93,255,.18),rgba(0,0,0,.42));}
  .tkCell.random:hover{border-color:#a884ff;box-shadow:0 0 16px rgba(125,93,255,.5);}
  .tkCell.random .tag{color:#a884ff;}
  .tkCell .tag{position:absolute;left:2px;right:2px;bottom:2px;font-size:7.5px;font-weight:700;
    letter-spacing:.4px;color:#dbe5f3;text-shadow:0 1px 2px #000,0 0 4px #000;}
  .tkTurn{font-size:13px;font-weight:800;letter-spacing:3px;animation:vspulse 1.7s infinite;}
  .mapGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-content:center;padding:6px 0 2px;}
  .mapCard{border-radius:10px;border:1px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer;
    background:rgba(4,7,13,.72);transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center;}
  .mapCard:hover{transform:translateY(-3px);border-color:#ffd76b;box-shadow:0 0 18px rgba(255,215,107,.35);}
  .mapCard.selMap{border-color:#ffd76b;box-shadow:0 0 0 2px #ffd76b inset,0 0 20px rgba(255,215,107,.45);}
  .mapCard canvas{display:block;width:100%;height:auto;background:#000;}
  .mapName{font-size:12px;font-weight:800;letter-spacing:2px;color:#dbe5f3;padding:8px 6px;}
  .pausePanel{width:min(360px,90vw);display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 40px;}
  .pausePanel h1{margin:0 0 6px;}
  .pausePanel .mbtn{width:100%;}
  .langRow{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .langRow span{font-size:13px;font-weight:700;color:#9fc3ef;letter-spacing:1px;}
  .langBtn{padding:7px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.18);cursor:pointer;
    background:rgba(255,255,255,.05);color:#cfe0f5;font-size:12.5px;font-weight:700;transition:all .15s;}
  .langBtn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px);}
  .langBtn.on{border-color:#ffd76b;color:#ffd76b;box-shadow:0 0 12px rgba(255,215,107,.35);}
  #scrHome{position:relative;background:transparent;width:100%;height:100%;flex:1;
    overflow:hidden;padding:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  @keyframes recBlink{0%,100%{opacity:1}50%{opacity:.2}}
  .vfr{position:absolute;width:36px;height:36px;z-index:22;pointer-events:none;}
  .hudOverlay{position:absolute;inset:0;z-index:30;pointer-events:none;}
  .vfr-tl{top:22px;left:22px;border-top:2px solid rgba(51,255,85,.45);border-left:2px solid rgba(51,255,85,.45);}
  .vfr-tr{top:22px;right:22px;border-top:2px solid rgba(51,255,85,.45);border-right:2px solid rgba(51,255,85,.45);}
  .vfr-bl{bottom:22px;left:22px;border-bottom:2px solid rgba(51,255,85,.45);border-left:2px solid rgba(51,255,85,.45);}
  .vfr-br{bottom:22px;right:22px;border-bottom:2px solid rgba(51,255,85,.45);border-right:2px solid rgba(51,255,85,.45);}
  .hud-tl{position:absolute;top:30px;left:34px;z-index:22;display:flex;align-items:center;gap:8px;}
  .recDot{width:8px;height:8px;border-radius:50%;background:#ff3333;box-shadow:0 0 6px #ff3333;animation:recPulse 1.2s ease-in-out infinite;}
  @keyframes recPulse{0%,100%{opacity:1;box-shadow:0 0 6px #ff3333}50%{opacity:.25;box-shadow:0 0 2px #ff3333}}
  .recTxt{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,55,55,.75);}
  .hud-tr{position:absolute;top:30px;right:34px;z-index:22;display:flex;align-items:center;gap:5px;}
  .badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.8px;line-height:1;}
  .hdOn{background:#fff;color:#111;}
  .hdOff{background:rgba(255,255,255,.1);color:rgba(255,255,255,.45);}
  .fpsLbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;margin-left:2px;}

  .battBody{width:18px;height:9px;border:1.5px solid rgba(51,255,85,.45);border-radius:2px;padding:1px;position:relative;display:inline-block;}
  .battFill{display:block;height:100%;width:67%;background:rgba(51,255,85,.55);border-radius:1px;}
  .battTip{width:2px;height:4px;background:rgba(51,255,85,.35);border-radius:0 1px 1px 0;margin-left:1px;}

  #timer{font-family:"Courier New",monospace;font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(51,255,85,.45);}
  .hud-br{position:absolute;bottom:30px;right:34px;z-index:22;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .menuLbl{font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(51,255,85,.45);}

  .menuLines span:nth-child(3){width:10px;}

  .charCard.p2{border-color:rgba(77,159,255,.5);box-shadow:0 0 26px rgba(77,159,255,.12) inset;}

          if(this.abGrace!==null){
            this.abGrace-=dt;
            if(this.abGrace<=0){
              this.abGrace=null;
              this.pend=null;   // cancel any roll that started during the grace period so it doesn't render/fire alongside
              const d1=1+Math.floor(rand(0,6)),d2=1+Math.floor(rand(0,6));
              this.abPend={d1,d2,t:1.9};
              this.abRevealed=false;
              addRing(this.x,this.y,'#7de3ff',ballR*.9);
              sfx('clone');shake+=3;
            }
          }else if(!this.pend){
            const d1=1+Math.floor(rand(0,6)),d2=1+Math.floor(rand(0,6));
            this.abPend={d1,d2,t:1.9};
            this.abRevealed=false;
            addRing(this.x,this.y,'#7de3ff',ballR*.9);
            sfx('clone');shake+=3;
          }
          // else: blocked by an in-progress roll and no grace armed yet - the roll-resolve handler above arms it
        }
      }else{
        // lock-on while charging the big throw (keeps moving, no slowdown)
        const e=balls.find(o=>o.alive&&o.team!==this.team&&!o.ghost);
        if(e){
          const ta=Math.atan2(e.y+e.vy*.15-this.y,e.x+e.vx*.15-this.x);
          this.ang+=angn(ta-this.ang)*Math.min(1,dt*16);
        }
        this.abPend.t-=dt;
        if(this.abPend.t<=0){
          const tot=this.abPend.d1+this.abPend.d2;
          let a=this.ang;
          if(e)a=Math.atan2(e.y+e.vy*.12-this.y,e.x+e.vx*.12-this.x);
          if(tot===7||tot===11){
            projectiles.push({x:this.x,y:this.y,vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,
              dmg:e?Math.round(e.maxHp*.4):20,size:24,own:this.id,kind:'dice',life:4,
              face:((tot-1)%6)+1,spin:rand(0,6),big:true,tnum:tot});
            addFloater(this.x,this.y-this.r-64,(tot===7?'LUCKY SEVEN!':'JACKPOT 11!')+' 40% HP','#ffd76b');
            sfx('arc');shake+=5;
          }else if(tot===2||tot===3||tot===12){
            const sd=Math.round(this.maxHp*.4);   // craps penalty ignores his own DR
            this.hp-=sd;this.flash=1;this.pend=null;
            addFloater(this.x,this.y-this.r-64,'CRAPS! -'+sd+' HP','#ff8a8a');
            spawnSparks(this.x,this.y,'#ff5d5d',20,320);
            sfx('boom');shake+=9;
            if(this.hp<=0){kill(this);return;}
          }else{
            projectiles.push({x:this.x,y:this.y,vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,
              dmg:tot,size:19,own:this.id,kind:'dice',life:4,
              face:((tot-1)%6)+1,spin:rand(0,6),big:true,tnum:tot});
            sfx('shoot');
          }
          this.abPend=null;this.diceAbT=rand(4,8);
          this.pend=null;this.diceT=1.5;   // main die was paused during the double roll; give it a fresh 1.5s cooldown
        }
      }
    }
    if(this.def.proj){
      if(!(this.w==='bow'&&this.chargeState>0)){
        this.pt-=dt;
        if(this.pt<=0){
          if(this.w==='bow'){
            const n=1+this.stacks,fw=Math.min(.7,(n-1)*.12);
            for(let k=0;k<n;k++)this.fire(n>1?(k/(n-1)-.5)*fw:0,true);
            sfx('shoot');
            this.pt=2.5;
          }else{this.pt=this.def.proj.rate*this.cdMul*rand(.8,1.2);this.fire();}
        }
      }
    }
    if(this.w==='staff'){
      const ELEMS=['fire','ice','lightning'];
      const ELEM_COLORS=['#ff4422','#44aaff','#bb44ff'];
      // Element shift ability
      this.mageShiftT-=dt;
      if(this.mageShiftT<=0){
        this.mageShiftT=rand(6,12);
        this.mageElem=(this.mageElem+1)%3;
        const col=ELEM_COLORS[this.mageElem];
        const aoeR=130+this.mageOrbSize*26;
        addRing(this.x,this.y,col,aoeR,aoeR);
        spawnSparks(this.x,this.y,col,22,340);
        shake+=8;hitstop=Math.max(hitstop,.14);
        sfx('arc');
        addFloater(this.x,this.y-this.r-34,ELEMS[this.mageElem].toUpperCase()+' BURST!',col);
        for(const b of balls){
          if(!b.alive||b.team===this.team||b.ghost)continue;
          if(Math.hypot(b.x-this.x,b.y-this.y)<aoeR+b.r){
            const raw=drDmg(b,.5+this.dmgBonus);
            b.hp-=raw;b.flash=1;
            addFloater(b.x,b.y-b.r-24,'-'+fmtD(raw)+' '+ELEMS[this.mageElem].toUpperCase(),'#ff8a8a');
            const dx2=b.x-this.x,dy2=b.y-this.y,dd=Math.hypot(dx2,dy2)||1;
            b.vx+=dx2/dd*600;b.vy+=dy2/dd*600-200;
            mageApplyStatus(b,this.mageElem,this.mageStatusChance,true,this);
            if(b.hp<=0)kill(b);
          }
        }
      }
      // Lock-on orb firing every 2s
      this.mageOrbT-=dt;
      const et=balls.find(o=>o.alive&&o.team!==this.team&&!o.ghost);
      if(et&&this.mageOrbT<.5&&this.mageOrbT>0){
        const ta=Math.atan2(et.y+et.vy*.12-this.y,et.x+et.vx*.12-this.x);
        this.ang+=angn(ta-this.ang)*Math.min(1,dt*16);
      }
      if(this.mageOrbT<=0){
        this.mageOrbT=2;
        const sz=10+this.mageOrbSize*5;
        const a=et?Math.atan2(et.y+et.vy*.12-this.y,et.x+et.vx*.12-this.x):this.ang;
        projectiles.push({
          x:this.x+Math.cos(a)*this.r*1.4,
          y:this.y+Math.sin(a)*this.r*1.4,
          vx:Math.cos(a)*640,vy:Math.sin(a)*640,
          dmg:.5+this.dmgBonus,
          size:sz,own:this.id,
          kind:'mageorb',
          mageElem:this.mageElem,
          mageStatusChance:this.mageStatusChance,
          mageOrbSize:this.mageOrbSize,
          life:5
        });
        sfx('shoot');
      }
    }
  }
}

const drDmg=(b,amt,noZap)=>{

  return amt*mul;
};

function tryHit(a,b,px,py,isProj,dirx,diry){
  if(a.ghost||b.ghost||b.zLatch)return;
  if(b.w==='zombie'&&(b.zState===2||b.zIFrames>simTime))return;
  if(a.team===b.team)return;
  if(a.w==='vlad' && impales.some(im=>im.ownerId===a.id))return;
  const key=isProj?('p'+a.own+'_'+b.id):(a.id+'_'+b.id);
  if((hitCd.get(key)||0)>simTime)return;
  const cd=isProj?0:(a.w==='dagger'?Math.max(.03,Math.PI/(a.def.spd*a.spdMul)):.22);
  hitCd.set(key,simTime+cd);
  let blocked=false;
  if(b.def.block&&!isProj){
    const threat=Math.atan2(a.y-b.y,a.x-b.x);
    blocked=angDiff(threat,b.ang)<1.15;
  }else if(b.def.block&&isProj){
    const threat=Math.atan2(-diry,-dirx);
    blocked=angDiff(threat,b.ang)<1.15;
  }
  const owner=isProj?balls.find(x=>x.id===a.own):a;
  let raw=isProj?a.dmg:(a.w==='staff'?a.def.dmg:(a.def.dmg+a.dmgBonus));
  if(blocked){
    spawnSparks(px,py,'#7de3ff',12,240);
    addFloater(b.x,b.y-b.r-24,'REFLECT!','#7de3ff');
    sfx('clang');shake+=5;hitstop=.05;
    const victim=isProj?owner:a;
    if(victim&&victim.alive){
      victim.hp-=drDmg(victim,raw);victim.flash=1;
      addFloater(victim.x,victim.y-victim.r-24,'-'+fmtD(raw),'#ff8a8a');
      if(victim.hp<=0)kill(victim);
    }
    b.skill();
    return;
  }
  raw=drDmg(b,raw,!isProj&&a.w==='staff');
  b.hp-=raw;b.flash=1;
  const K=isProj?320:a.def.knock*a.knockMul,LIFT=190;
  if(isProj){b.vx+=dirx*K;b.vy+=diry*K-LIFT;}
  else{
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
    b.vx+=nx*K;b.vy+=ny*K-LIFT;
    const rec=(a.w==='shield'&&a.prepLeft>0)?0:70;
    a.vx-=nx*rec;a.vy-=ny*rec;
    if(a.w==='hammer'){b.wallMark=simTime+.95;b.wallGiant=a.giantUntil>simTime;}
  }
  spawnSparks(px,py,'#ffd76b',8,200);
  addFloater(px,py-10,'-'+fmtD(raw),'#ff8a8a');
  sfx('hit');shake+=Math.min(9,raw*.4);
  hitstop=!isProj&&a.w==='hammer'?.1:.055;
  if(!isProj&&a.w==='hammer')addRing(px,py,'#ffd76b',ballR*.7);
  if(!isProj&&a.w==='scythe'){
    const h=Math.max(.1,raw);
    a.hp=Math.min(a.maxHp,a.hp+h);
    addFloater(a.x,a.y-a.r-30,'+'+fmtD(h),'#7dff8a');
  }
  if(!isProj&&a.w==='shield'&&a.fiery){
    if(!(b.burn&&b.burn.until>simTime))b.burn={until:simTime+3,next:simTime+1};
    else b.burn.until=simTime+3;
    spawnSparks(px,py,'#ff9d5c',6,180);
    addFloater(b.x,b.y-b.r-40,'BURNING!','#ff9d5c');
  }
  if(owner&&owner.w!=='staff'&&!(owner.w==='hammer'&&owner.giantUntil>simTime)&&!((owner.w==='katana'||owner.w==='sword'||owner.w==='bow')&&!isProj)&&owner.w!=='shield'&&!b.zMini){
    if(owner.w!=='bow'||simTime>=owner.volSkillT){
      if(owner.w==='bow')owner.volSkillT=simTime+.4;
      owner.skill();
    }
  }
if(!isProj&&a.w==='vlad'&&b.alive){
    const gain=Math.round(rand(1,20));
    a.lastBleed=gain;
    b.bleed=Math.min(100,(b.bleed||0)+gain);
    procBleed(b);
  }
  if(b.hp<=0)kill(b);
}

function vladImpale(v,victim,dir){
  // Pin victim to the wall they'd slide into along the throw direction
  const r=victim.r;
  let dWall=1e9;
  const vx=victim.x,vy=victim.y;
  if(dir.x>1e-6) dWall=Math.min(dWall,(AR.r-r-vx)/dir.x);
  if(dir.x<-1e-6)dWall=Math.min(dWall,(AR.l+r-vx)/dir.x);
  if(dir.y>1e-6) dWall=Math.min(dWall,(AR.b-r-vy)/dir.y);
  if(dir.y<-1e-6)dWall=Math.min(dWall,(AR.t+r-vy)/dir.y);
  if(dWall<0||dWall===1e9)dWall=0;
  const pinX=Math.max(AR.l+r,Math.min(AR.r-r,vx+dir.x*dWall));
  const pinY=Math.max(AR.t+r,Math.min(AR.b-r,vy+dir.y*dWall));
  victim.hp-=drDmg(victim,2);victim.flash=1;
  victim.impOwner=true;
  victim.pinX=Math.max(AR.l+r,Math.min(AR.r-r,vx));
  victim.pinY=Math.max(AR.t+r,Math.min(AR.b-r,vy));
  victim.vx=0;victim.vy=0;
  addFloater(victim.x,victim.y-r-20,'IMPALED!','#a03030');
  spawnSparks(victim.x,victim.y,'#a03030',16,260);sfx('boom');shake+=6;hitstop=.1;
  const _vU=v.r/30,_vS=30,_vLen=_vS*v.def.mul*v.lenMul*1.7,_vTip=_vS+_vLen;
  const dragT=Math.max(.2,Math.min(1.1,Math.hypot(pinX-victim.x,pinY-victim.y)/520));
  // Drag the victim to the wall over dragT seconds instead of teleporting them
  impales.push({x:victim.pinX,y:victim.pinY,team:v.team,ownerId:v.id,victimId:victim.id,tickT:.5,
    drag:0,dragT:dragT,fromX:victim.pinX,fromY:victim.pinY,targetX:pinX,targetY:pinY,impacted:false,
    ang:Math.atan2(dir.y,dir.x),
    tipAhead:victim.r,
    spearU:_vU,spearS:_vS,spearLen:_vLen,spearTip:_vTip});
  v.vImpState=0;v.vImpT=rand(5,10);v.vImpTip=null;v.vImpDir=null;v.vImpTarget=null;v.vImpOrigin=null;v.vImpCarry=null;
  if(victim.hp<=0){victim.impOwner=null;impales.pop();kill(victim);}
}

function spawnBattle(n,grav,w1,w2){
  balls=[];projectiles=[];particles=[];floaters=[];rings=[];beams=[];slashFx=null;stabs=[];souls=[];pickups=[];impales=[];
  replayBuf=[];replayMode=false;killcamDone=false;replayDeath=0;replayPost=0;replayFromWin=false;
  hitCd.clear();clashCd.clear();
  GRAV=grav?750:0;
  ballR=Math.max(24,Math.min(80,(AR.r-AR.l)*.05));
  winner=null;endPending=false;targetTS=1;timeScale=1;
  countdown=3;cdFightT=0;cdJit=0;
  if(n===2&&w1&&w2){
    const cy=(AR.t+AR.b)/2;
    balls.push(new Ball(w1,AR.l+(AR.r-AR.l)*.26,cy,0,P1C));
    balls.push(new Ball(w2,AR.l+(AR.r-AR.l)*.74,cy,1,P2C));
    return;
  }
  const pool=[...KEYS].sort(()=>Math.random()-.5);
  const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);
  const aw=AR.r-AR.l,ah=AR.b-AR.t;
  for(let i=0;i<n;i++){
    const c=i%cols,r=(i/cols)|0;
    const x=AR.l+aw*(c+.5)/cols+rand(-20,20);
    const y=AR.t+ah*(r+.8)/(rows+1)+rand(-15,15);
balls.push(new Ball(pool[i%pool.length],x,y,i));
  }
}

function cdBeep(f,dur,vol,slide){
  if(!AC)return;
  const ob=curBus;curBus=sfxVol;
  try{tone(f,dur,'square',vol,slide);nz(.04,.04,5200,2400);}catch(e){}
  curBus=ob;
}
function fightSfx(){
  if(!AC)return;
  const ob=curBus;curBus=sfxVol;
  try{
    tone(330,.22,'square',.11,-120);
    tone(165,.3,'triangle',.12,-40);
    nz(.25,.15,1900,260);
    sub(90,.35,.18,.12);
  }catch(e){}
  curBus=ob;
}
function cdTick(dt){
  if(countdown>0){
    const prev=Math.ceil(countdown);
    countdown-=dt;
    const cur=Math.ceil(countdown);
    if(cur!==prev&&cur>0){cdBeep(200+cur*170,.13,.08,0);cdJit=1;}
    if(countdown<=0&&!cdFightT){cdFightT=.9;fightSfx();cdJit=1.4;}
  }else if(cdFightT>0){
    cdFightT-=dt;
    if(cdFightT<=0)cdFightT=0;
  }
  cdJit=Math.max(0,cdJit-dt*3.4);
}

function spawnHorde(o){
  sfx('horde');shake+=6;
  addRing(o.x,o.y,'#7dc87d',100);
  addFloater(o.x,o.y-o.r-42,'ZOMBIE HORDE!','#8fd18a');
  const n=10+(o.zExtra||0);
  for(let k=0;k<n;k++){
    const leftSide=k%2===0;
    const x=leftSide?AR.l-rand(30,90):AR.r+rand(30,90);
    const y=rand(AR.t+60,AR.b-60);
    const m=new Ball('zombie',x,y,o.team,o.color);
    m.isClone=true;m.zMini=true;m.hp=8;m.maxHp=8;m.r=o.r*.5;m.cap=430;
    m.zEnter=true;
    m.zWp={x:leftSide?AR.l+rand(80,200):AR.r-rand(80,200),y};
    balls.push(m);
    spawnSparks(x,y,'#7dc87d',4,90);
  }
}

function step(dt){
  if(dt<=0)return;
  const sub=Math.min(5,Math.max(1,Math.ceil(dt/.008)));
  const h=dt/sub;
  for(let s=0;s<sub;s++){
    simTime+=h;
    for(const b of balls)b.update(h);
    for(const b of balls)if(b.alive&&!b.impOwner&&(b.bleed||0)>0)b.bleed=Math.max(0,b.bleed-h);
for(let i=impales.length-1;i>=0;i--){
      const im=impales[i];
      const owner=balls.find(o=>o.id===im.ownerId);
      const victim=balls.find(o=>o.id===im.victimId);
      if(!owner||!owner.alive||!victim||!victim.alive){
        if(victim&&victim.alive)victim.impOwner=null;
        impales.splice(i,1);continue;
      }
      victim.bleed=Math.min(100,(victim.bleed||0)+h);
      procBleed(victim);
      if(im.drag<im.dragT){
        im.drag+=h;
        const k=Math.min(1,im.drag/im.dragT),e=k*k*(3-2*k);
        im.x=im.fromX+(im.targetX-im.fromX)*e;
        im.y=im.fromY+(im.targetY-im.fromY)*e;
        victim.pinX=im.x;victim.pinY=im.y;
      }else{
        im.x=im.targetX;im.y=im.targetY;
        victim.pinX=im.x;victim.pinY=im.y;
        if(!im.impacted){
          im.impacted=true;
          spawnSparks(im.x,im.y,'#ff5d5d',22,340);
          spawnSparks(im.x,im.y,'#fff0f0',12,260);
          addFloater(im.x,im.y-victim.r-28,'IMPALED!','#ff5d5d');
          shake+=7;hitstop=Math.max(hitstop,.08);
          sfx('boom');
        }
      }
      if(owner.w==='vlad'&&GRAV>0){
        const dx=im.x-owner.x,dy=im.y-owner.y,d=Math.hypot(dx,dy)||1;
        if(d>owner.r+30){const pull=480*h;owner.vx+=dx/d*pull;owner.vy+=dy/d*pull;}
        else{owner.vx*=.9;owner.vy*=.9;}
      }
      im.tickT-=h;
      if(im.tickT<=0){im.tickT=.5;
        victim.hp-=drDmg(victim,1);victim.flash=1;
        addFloater(victim.x,victim.y-victim.r-26,'-1','#d04444');
        if(victim.hp<=0){
          victim.impOwner=null;
          for(let k=impales.length-1;k>=0;k--)if(impales[k].victimId===victim.id)impales.splice(k,1);
          kill(victim);continue;
        }
      }
      // The whole spear shaft is the grab hitbox: touching any part takes it back
      const U=(im.spearU||1)*1.4,tipA=(im.tipAhead||0),shL=(im.spearLen||46)*U;
      const cD=Math.cos(im.ang),sD=Math.sin(im.ang);
      const ax=im.x+cD*(tipA-shL),ay=im.y+sD*(tipA-shL),bx=im.x+cD*tipA,by=im.y+sD*tipA;
      const wx=bx-ax,wy=by-ay,qx=owner.x-ax,qy=owner.y-ay,L2=wx*wx+wy*wy;
      let tt=L2>0?(qx*wx+qy*wy)/L2:0;tt=Math.max(0,Math.min(1,tt));
      const ddx=qx-wx*tt,ddy=qy-wy*tt;
      if(Math.hypot(ddx,ddy)<owner.r+2.4*U+3){
        victim.impOwner=null;
        addRing(im.x,im.y,'#a03030',50);spawnSparks(im.x,im.y,'#a03030',12,220);sfx('tick');
        impales.splice(i,1);
      }
    }
    for(const b of balls){
      if(!b.alive||b.w!=='scythe')continue;
      const so=souls.find(s=>s.oTeam===b.team);
      if(!so)continue;
      const dx=so.x-b.x,dy=so.y-b.y,d=Math.hypot(dx,dy)||1,min=b.r+so.r;
      if(d>min*1.05){const pl=260*h;b.vx+=dx/d*pl;b.vy+=dy/d*pl;}
    }
    for(let i=0;i<balls.length;i++){
      const a=balls[i];if(!a.alive)continue;
      for(let j=i+1;j<balls.length;j++){
        const b=balls[j];if(!b.alive)continue;
        if(a.ghost||b.ghost||a.zLatch||b.zLatch||a.impOwner||b.impOwner)continue;
        if(a.team===b.team)continue;
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
        if(d<min&&d>0){
          const nx=dx/d,ny=dy/d,ov=(min-d)/2;
          const ap=a.w==='katana'&&a.dashState===1,bp=b.w==='katana'&&b.dashState===1;
          const ap2=ap||(a.w==='shield'&&a.prepLeft>0),bp2=bp||(b.w==='shield'&&b.prepLeft>0);
          const aImp=!!a.impOwner,bImp=!!b.impOwner;
          if(!aImp){a.x-=nx*ov*(ap2?0:bp2?1:.5);a.y-=ny*ov*(ap2?0:bp2?1:.5);}
          if(!bImp){b.x+=nx*ov*(bp2?0:ap2?1:.5);b.y+=ny*ov*(bp2?0:ap2?1:.5);}
          // restore pinned positions
          if(aImp){a.x=a.pinX;a.y=a.pinY;}
          if(bImp){b.x=b.pinX;b.y=b.pinY;}
          const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
          if(vr<0){const jm=-(1+.98)*vr/2;
            if(!ap2){a.vx-=jm*nx;a.vy-=jm*ny;}
            if(!bp2){b.vx+=jm*nx;b.vy+=jm*ny;}}
        }else if(d>min*1.05&&d>0){
          const aS=a.w==='scythe'&&souls.some(s=>s.oTeam===a.team)&&b.team!==a.team;
          const bS=b.w==='scythe'&&souls.some(s=>s.oTeam===b.team)&&a.team!==b.team;
          if(!aS&&!bS){
            const pl=200*h;
            a.vx+=dx/d*pl;a.vy+=dy/d*pl;
            b.vx-=dx/d*pl;b.vy-=dy/d*pl;
          }
        }
      }
    }
    for(const a of balls){
      if(!a.alive||a.impOwner)continue;

      if(a.mageIceUntil>simTime)continue;
      // Vlad can't use his weapon while spear is impaled in the wall
      if(a.w==='vlad'&&(a.vImpState===2||impales.some(im=>im.ownerId===a.id)))continue;
      const reach=a.r*(1+a.def.mul*a.lenMul*1.4)*a.wsc();
      const ca=Math.cos(a.ang),sa=Math.sin(a.ang);

      const gs=a.w==='hammer'?a.wsc():1;

        for(let k=0;k<=4;k++){const t=k/4;spts.push(MP(54+(T-54)*t,0));}
      }else if(a.w==='dagger'){
        for(let k=0;k<=3;k++){const t=k/3,m=1-t;spts.push(MP(m*m*53+2*m*t*(53+T)*.47+t*t*T,2*m*t*-2.5));}
      }else if(a.w==='spear'||a.w==='vlad'){
        const sn=Math.max(3,Math.min(24,Math.ceil((T-37)*wf/38)));

      }else if(a.w==='hammer'){
        for(const[x,y]of[[32,0],[(32+T-26)/2,0],[T-26,0]])spts.push(MP(x,y));
        for(const gx of[T-31,T-24,T-15,T-8])for(const gy of[-22,0,22])spts.push(MP(gx,gy));
      }else if(a.w==='bow'){
        const L2=(T-14)/2;
        for(let k=0;k<=4;k++){const t=k/4,m=1-t;spts.push(MP(m*m*36+2*m*t*53+t*t*36,m*m*-L2+t*t*L2));}
        spts.push(MP(27,0));spts.push(MP(T-2,0));
      }else if(a.w==='scythe'){
        const sy2=a.rotDir>0?-1:1;
        const p0=T*.9667,cx=T*.9278,cy=-T*.2478*sy2,p1x=T*.8889,p1y=-T*.3444*sy2;
        for(const[sx,sy3]of[[34,0],[(34+T)/2,0],[T-8,0]])spts.push(MP(sx,sy3));
        for(let k=0;k<=6;k++){const t=k/6,m=1-t;spts.push(MP(m*m*p0+2*m*t*cx+t*t*p1x,2*m*t*cy+t*t*p1y));}
      }else{
        const n=Math.max(2,Math.min(16,Math.ceil((reach-a.r)/34)));
        for(let k=1;k<=n;k++){
          const d=a.r+(reach-a.r)*(k-.5)/n;
          spts.push([a.x+ca*d,a.y+sa*d]);
        }
      }
      for(const b of balls){
        if(!b.alive||b.id===a.id||b.team===a.team)continue;
        const R=b.r*1.03;
        for(const[px,py]of spts){
          if(Math.hypot(px-b.x,py-b.y)<R){tryHit(a,b,px,py,false);break;}
        }
      }
      for(const so of souls){
        if(so.oTeam!==a.team)continue;
        const SR=so.r+a.r*.35;
        for(const[px,py]of spts){
          if(Math.hypot(px-so.x,py-so.y)<SR){soulStrike(a,so,px,py);break;}
        }
      }
    }
    for(let i=0;i<balls.length;i++){
      const a=balls[i];if(!a.alive)continue;
      for(let j=i+1;j<balls.length;j++){
        const b=balls[j];if(!b.alive)continue;
        if(a.ghost||b.ghost||a.zLatch||b.zLatch||a.impOwner||b.impOwner||a.mageIceUntil>simTime||b.mageIceUntil>simTime||(clashCd.get(a.id+'_'+b.id)||0)>simTime)continue;
        if(a.team===b.team)continue;
        if(a.w==='hammer'&&a.giantUntil>simTime||b.w==='hammer'&&b.giantUntil>simTime)continue;
        if((a.w==='scythe'&&a.reapState===2)||(b.w==='scythe'&&b.reapState===2))continue;
          if(a.w==='spear'&&a.lenMul>=3||b.w==='spear'&&b.lenMul>=3)continue;
        const mkSeg=o=>{
          const co=Math.cos(o.ang),si=Math.sin(o.ang),w=o.r/30*1.4;

        };

          let md=1e9,mx2=0,my2=0;
          const c1=ptSeg(a1x,a1y,b1x,b1y,tb.x,tb.y);if(c1<md){md=c1;mx2=a1x;my2=a1y;}
          const c2=ptSeg(ta.x,ta.y,b1x,b1y,tb.x,tb.y);if(c2<md){md=c2;mx2=ta.x;my2=ta.y;}
          const c3=ptSeg(b1x,b1y,a1x,a1y,ta.x,ta.y);if(c3<md){md=c3;mx2=b1x;my2=b1y;}

          const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,P=a.r*8;

        }
      }
    }

      ctx.beginPath();
      for(let k=0;k<4;k++){
        const a2=k/4*Math.PI*2;
        const ox=Math.cos(a2)*sz,oy=Math.sin(a2)*sz;
        const a3=(k+.5)/4*Math.PI*2;
        const ix=Math.cos(a3)*sz*.35,iy=Math.sin(a3)*sz*.35;
        if(k===0)ctx.moveTo(ox,oy);else ctx.lineTo(ox,oy);
        ctx.lineTo(ix,iy);
      }
      ctx.closePath();ctx.fillStyle='#c8e8ff';ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(0,0,sz*.2,0,7);ctx.fill();
      ctx.restore();
    }else{
              addFloater(own.x,own.y-own.r-26,'MISSED','#8b93a0');
            }
            if(!p.hit)own.reapT=rand(5,9);
          }
        }
        if(done)projectiles.splice(i,1);
        continue;
      }
      p.life-=h;p.spin=(p.spin||0)+h*(p.size>16?6:11);
      if(p.big||p.kind==='dice'){
        p.home=Math.max(0,(p.home||0)-h);
        const t=balls.find(o=>o.alive&&o.id!==p.own&&!o.ghost);
        const turnRate=p.kind==='dice'?5:(p.big&&p.home>0?2.6:0);
        if(t&&turnRate>0){
          const sp=Math.hypot(p.vx,p.vy)||1,ta=Math.atan2(t.y-p.y,t.x-p.x),ca=Math.atan2(p.vy,p.vx);
          const na=ca+angn(ta-ca)*Math.min(1,h*turnRate);
          p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;
        }
      }
      let dead=p.kind==='ninjaStar'?false:p.life<=0,hitB=null;
      if(p.kind==='ninjaStar'){
        let bounced=false;
        if(p.x<AR.l+R&&p.vx<0){p.vx=-p.vx;bounced=true;}
        if(p.x>AR.r-R&&p.vx>0){p.vx=-p.vx;bounced=true;}
        if(p.y<AR.t+R&&p.vy<0){p.vy=-p.vy;bounced=true;}
        if(p.y>AR.b-R&&p.vy>0){p.vy=-p.vy;bounced=true;}
        if(bounced){
          if(p.bounce<p.maxBounce){p.bounce++;spawnSparks(p.x,p.y,'#8af',6,160);sfx('tick');}
          else dead=true;
        }
      }else{
        if((p.x<AR.l+R&&p.vx<0)||(p.x>AR.r-R&&p.vx>0))dead=true;
        if((p.y<AR.t+R&&p.vy<0)||(p.y>AR.b-R&&p.vy>0))dead=true;
      }
      if(!dead)for(const b of balls){
        if(!b.alive||b.id===p.own||b.ghost)continue;
        if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+R){
          const d=Math.hypot(p.vx,p.vy)||1;
          if(p.kind==='mageorb'){
            const raw=drDmg(b,p.dmg);
            b.hp-=raw;b.flash=1;
            const ECOLS=['#ff4422','#44aaff','#bb44ff'];
            addFloater(b.x,b.y-b.r-24,'-'+fmtD(raw),ECOLS[p.mageElem]);
            const nx2=p.vx/d,ny2=p.vy/d;
            b.vx+=nx2*320;b.vy+=ny2*320-160;
            const owner2=balls.find(x=>x.id===p.own);
            mageApplyStatus(b,p.mageElem,owner2?owner2.mageStatusChance:p.mageStatusChance,false,owner2);
            sfx('hit');shake+=Math.min(9,raw*.4);hitstop=.055;
            if(owner2&&!b.zMini)owner2.skill();
            if(b.hp<=0)kill(b);
          }else if(p.kind==='ninjaStar'){
            tryHit(p,b,p.x,p.y,true,p.vx/d,p.vy/d);
            const own=balls.find(x=>x.id===p.own);
            if(own&&own.w==='throwStar'){own.njMaxBounce++;own.njStacks++;}
          }else{
            tryHit(p,b,p.x,p.y,true,p.vx/d,p.vy/d);
          }
          dead=true;hitB=b;break;
        }
      }
      if(dead&&p.kind==='mageorb'){
        const ECOLS=['#ff4422','#44aaff','#bb44ff'];
        const aoeR=R*(2.5+p.mageOrbSize*.4);
        const ow=balls.find(x=>x.id===p.own);
        mageOrbExplode(p.x,p.y,aoeR,p.dmg,p.own,hitB,p.mageElem,ow?ow.mageStatusChance:p.mageStatusChance,ow);
      }else if(dead&&p.kind==='orb')explode(p.x,p.y,R*3.2,Math.max(1,Math.round(p.dmg*.5)),p.own,hitB);
      else if(dead&&!hitB)spawnSparks(p.x,p.y,p.kind==='dice'?'#f3f4f8':'#cfd8e3',5,140);
      if(dead)projectiles.splice(i,1);
    }
    for(let i=souls.length-1;i>=0;i--){
      const so=souls[i];so.t+=h;
      const v=balls.find(o=>o.alive&&o.id===so.eid);
      if(!v){souls.splice(i,1);continue;}
      if(so.t>2&&Math.hypot(v.x-so.x,v.y-so.y)<v.r+so.r){
        souls.splice(i,1);
        addRing(so.x,so.y,v.color,60);
        spawnSparks(so.x,so.y,v.color,12,220);
        addFloater(v.x,v.y-v.r-26,'SOUL BACK','#9fd0ff');
        sfx('vanish');
        for(const r of balls)if(r.alive&&r.team===so.oTeam&&r.w==='scythe'){r.reapT=rand(5,9);r.reapState=0;}
      }
    }
    for(let i=pickups.length-1;i>=0;i--){
      const pk=pickups[i];
      if(pk.kind==='sushi'){
        for(const b of balls){
          if(!b.alive||b.ghost)continue;
          if(Math.hypot(b.x-pk.x,b.y-pk.y)<b.r+pk.r){
            pickups.splice(i,1);
            if(b.team===pk.oTeam){
              b.hp=Math.min(b.maxHp,b.hp+3);
              addFloater(b.x,b.y-b.r-24,'+3 HP','#7dff8a');
              spawnSparks(pk.x,pk.y,'#7dff8a',10,200);
              sfx('clone');
            }else sushiBoom(pk,b);
            break;
          }
        }
      }else{
        const ja=(Math.random()-.5)*1.4*h,ca=Math.cos(ja),sa=Math.sin(ja);
        const nvx=pk.vx*ca-pk.vy*sa,nvy=pk.vx*sa+pk.vy*ca;
        pk.vx=nvx;pk.vy=nvy;
        pk.vy+=GRAV*h;
        const idr=Math.exp(-.03*h);pk.vx*=idr;pk.vy*=idr;
        pk.x+=pk.vx*h;pk.y+=pk.vy*h;
        if(pk.x<AR.l+22){pk.x=AR.l+22;pk.vx=Math.abs(pk.vx);}
        if(pk.x>AR.r-22){pk.x=AR.r-22;pk.vx=-Math.abs(pk.vx);}
        if(pk.y<AR.t+22){pk.y=AR.t+22;pk.vy=Math.abs(pk.vy);}
        if(pk.y>AR.b-22){pk.y=AR.b-22;pk.vy=-Math.abs(pk.vy)*.45;}
        for(const b of balls){
          if(!b.alive||b.w!=='shield'||b.prepLeft>0||b.ghost)continue;
          if(Math.hypot(b.x-pk.x,b.y-pk.y)<b.r+pk.r){b.eatIng();pickups.splice(i,1);break;}
        }
      }
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=smokes.length-1;i>=0;i--){
    const s=smokes[i];s.life-=dt;
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.96;s.vy*=.96;
    if(s.life<=0)smokes.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.life-=dt;f.y-=40*dt;
    if(f.life<=0)floaters.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.life-=dt;r.r+=(r.max-r.r)*10*dt;
    if(r.life<=0)rings.splice(i,1);
  }
  for(let i=bolts.length-1;i>=0;i--){
    bolts[i].life-=dt;
    if(bolts[i].life<=0)bolts.splice(i,1);
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function drawWeapon(b){
  if(b.w==='scythe'&&b.reapState===2)return;
  const u=b.r/30,s=30,s0=s+2,len=s*b.def.mul*b.lenMul,tip=s+len;

  if(b.w==='sword'){

    ctx.fillStyle='#6f4a26';ctx.fillRect(s0,-3.2,g1-s0,6.4);
    ctx.fillStyle='#57381c';
    for(let i=0;i<3;i++)ctx.fillRect(s0+2.5+i*3.6,-3.2,1.8,6.4);
    ctx.fillStyle='#b9c2cb';ctx.strokeStyle='#5d6873';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(s0+1.5,0,4,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#aab4be';
    rr(g1,-11,5,22,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(g1+5,-11);ctx.lineTo(g1+9,-14);ctx.lineTo(g1+9,-7);ctx.lineTo(g1+5,-6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(g1+5,11);ctx.lineTo(g1+9,14);ctx.lineTo(g1+9,7);ctx.lineTo(g1+5,6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#dfe6ee';ctx.strokeStyle='#8d9aa8';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(g1+10,-7);ctx.lineTo(tip-9,-3.5);ctx.lineTo(tip,0);
    ctx.lineTo(tip-9,3.5);ctx.lineTo(g1+10,7);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(g1+11,-5.4);ctx.lineTo(tip-11,-2.5);ctx.stroke();
    ctx.strokeStyle='rgba(96,110,124,.55)';
    ctx.beginPath();ctx.moveTo(g1+11,0);ctx.lineTo(tip-12,0);ctx.stroke();
  }else if(b.w==='katana'){
    // Hand-forged katana: crimson-wrapped tsuka, gilded tsuba, straight blade
    const Ltot=tip-s0;
    const tsuEnd=s0+Ltot*.23;
    const bStart=tsuEnd+7.2;
    const bEnd=s0+Ltot;
    const blLen=bEnd-bStart;
    const thick=t=>t>.84?Math.max(0,(1-t)/.16):1; // kissaki taper

    // Kashira cap
    ctx.fillStyle='#3a3126';
    rr(s0-1.8,-2.5,3.2,5,1.2);ctx.fill();
    ctx.strokeStyle='#d9a43e';ctx.lineWidth=.6;
    rr(s0-1.8,-2.5,3.2,5,1.2);ctx.stroke();

    // Tsuka core + crimson diamond wrap
    ctx.fillStyle='#191521';
    rr(s0+1,-2.7,tsuEnd-s0-1,5.4,1.6);ctx.fill();
    ctx.save();
    rr(s0+1.4,-2.6,tsuEnd-s0-2,5.2,1);ctx.clip();
    ctx.strokeStyle='#c22b36';ctx.lineWidth=1.25;
    for(let x=s0-4;x<tsuEnd+4;x+=2.6){
      ctx.beginPath();ctx.moveTo(x,-3.4);ctx.lineTo(x+4.2,3.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+4.2,-3.4);ctx.lineTo(x,3.4);ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle='#ffd76b';
    ctx.beginPath();ctx.arc((s0+tsuEnd)/2,0,.9,0,7);ctx.fill();

    // Tsuba guard
    ctx.fillStyle='#22252d';
    ctx.beginPath();ctx.ellipse(tsuEnd+1.7,0,2,5.6,0,0,7);ctx.fill();
    ctx.strokeStyle='#d9a43e';ctx.lineWidth=.8;
    ctx.beginPath();ctx.ellipse(tsuEnd+1.7,0,2,5.6,0,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(217,164,62,.5)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.ellipse(tsuEnd+1.7,0,1.1,3.9,0,0,7);ctx.stroke();

    // Habaki collar
    ctx.fillStyle='#c8912e';
    ctx.fillRect(tsuEnd+3.3,-2.7,3,5.4);
    ctx.fillStyle='#eec963';
    ctx.fillRect(tsuEnd+3.3,-2.7,1.1,5.4);

    // Curved blade
    const N=16;
    ctx.save();
    ctx.shadowColor='#37c6ff';ctx.shadowBlur=12;
    const bg=ctx.createLinearGradient(0,-4,0,4);
    bg.addColorStop(0,'#f4faff');
    bg.addColorStop(.45,'#c7d6e6');
    bg.addColorStop(1,'#8fa2b8');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(bStart,-2.3);
    for(let k=1;k<=N;k++){const t=k/N;ctx.lineTo(bStart+blLen*t,-2.3*thick(t));}
    for(let k=N;k>=0;k--){const t=k/N;ctx.lineTo(bStart+blLen*t,2.6*thick(t));}
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    // Shinogi ridge line
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.75;
    ctx.beginPath();
    for(let k=0;k<=N;k++){const t=k/N*.85,x=bStart+blLen*t,y=-1.15*thick(t);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
    // Hamon temper wave
    ctx.strokeStyle='rgba(150,205,255,.4)';ctx.lineWidth=.8;
    ctx.beginPath();
    for(let k=0;k<=N;k++){const t=k/N*.84,x=bStart+blLen*t,y=(0.7+Math.sin(x*.8)*.45)*thick(t);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
    // Polished cutting edge
    ctx.strokeStyle='rgba(235,250,255,.95)';ctx.lineWidth=1.05;
    ctx.shadowColor='#9fe8ff';ctx.shadowBlur=6;
    ctx.beginPath();
    for(let k=0;k<=N;k++){const t=k/N*.985,x=bStart+blLen*t,y=2.35*thick(t);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
    ctx.shadowBlur=0;
    // Yokote tip facet
    const yt=.86,yx=bStart+blLen*yt;

    const gt=(simTime*.32)%1,gx2=bStart+blLen*gt;

    ctx.lineTo(gx2+blLen*.02,1.4*thick(gt));
    ctx.stroke();
    ctx.globalCompositeOperation='source-over';
    ctx.lineCap='butt';
    ctx.restore();
  }else if(b.w==='dagger'){
    const g0=s0+16;
    ctx.fillStyle='#101218';ctx.beginPath();ctx.arc(s0+1.5,0,3.1,0,7);ctx.fill();
    ctx.fillStyle='#c9a6ff';ctx.beginPath();ctx.arc(s0+1.5,0,1.5,0,7);ctx.fill();
    ctx.fillStyle='#28221d';ctx.beginPath();
    ctx.moveTo(s0+4.5,-2.3);ctx.lineTo(g0-2,-1.9);ctx.lineTo(g0-2,1.9);ctx.lineTo(s0+4.5,3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#4d4438';
    for(let i=0;i<4;i++){
      const x=s0+5.5+i*2.35;
      ctx.beginPath();ctx.moveTo(x,-2.2);ctx.lineTo(x+1.2,-2);ctx.lineTo(x+.6,2);ctx.lineTo(x-.6,2.2);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#aab6c4';
    ctx.beginPath();
    ctx.moveTo(g0+4.5,-2.6);
    ctx.quadraticCurveTo(g0+(tip-g0)*.42,-5.4,tip-7,-1.4);
    ctx.lineTo(tip,0);
    ctx.lineTo(tip-7,1.4);
    ctx.quadraticCurveTo(g0+(tip-g0)*.42,5.4,g0+4.5,2.6);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#e9eff5';
    ctx.beginPath();
    ctx.moveTo(g0+4.5,.3);ctx.lineTo(tip-1,.12);ctx.lineTo(g0+4.5,1.5);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(201,166,255,.55)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(g0+6,-.4);ctx.lineTo(tip-6,-.4);ctx.stroke();
    ctx.strokeStyle='#3a3442';ctx.lineWidth=2.4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(g0-1.5,-6.5);ctx.quadraticCurveTo(g0+2.5,-3,g0+2.5,0);
    ctx.quadraticCurveTo(g0+2.5,3,g0-1.5,6.5);ctx.stroke();
    ctx.lineCap='butt';
    ctx.fillStyle='#8b93a0';rr(g0+1.5,-3.4,2.4,6.8,1);ctx.fill();
  }else if(b.w==='spear'){
    ctx.fillStyle='#7a1f1f';ctx.fillRect(s0,-2.6,len-8,5.2);
    ctx.fillStyle='#a03030';ctx.fillRect(s0,-2.6,len-8,1.6);
    ctx.fillStyle='#d9a441';
    ctx.fillRect(tip-14,-3.4,5,6.8);

    ctx.strokeStyle='#7a1f1f';ctx.lineWidth=.9;

    ctx.fillStyle='#8b1e1e';ctx.fillRect(s0+2,-3,4.5,6);
    ctx.fillStyle='#cfd8e2';
    ctx.beginPath();ctx.moveTo(tip-10,-3);ctx.lineTo(tip,0);ctx.lineTo(tip-10,3);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#5d6873';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tip-9,-2.8);ctx.lineTo(tip-.6,-.3);ctx.stroke();
    ctx.fillStyle='#7a1f1f';ctx.fillRect(tip-12,-2.4,2,4.8);
  }else if(b.w==='hammer'){
    ctx.fillStyle='#453222';ctx.fillRect(s0,-2.4,len-26,4.8);
    ctx.strokeStyle='#2b1f14';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const x=s0+7+i*8.5;
      ctx.beginPath();ctx.moveTo(x,-2.4);ctx.lineTo(x+3,2.4);ctx.stroke();
    }
    ctx.fillStyle='#39404a';
    ctx.beginPath();ctx.moveTo(tip-32,0);ctx.lineTo(tip-43,-5.5);ctx.lineTo(tip-43,5.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#33393f';
    ctx.fillRect(tip-33,-25,6.5,50);
    ctx.fillRect(tip-13,-25,6.5,50);
    ctx.fillStyle='#78828e';
    ctx.fillRect(tip-27.5,-21,15.5,42);
    ctx.fillStyle='#9aa5b2';
    ctx.fillRect(tip-27.5,-21,15.5,6.5);
    ctx.fillRect(tip-27.5,14.5,15.5,6.5);
    ctx.fillStyle='#4c555f';
    ctx.fillRect(tip-15,-21,3.2,42);
    ctx.fillStyle='#ff9d5c';
    ctx.fillRect(tip-25,-10,12,2.6);
    ctx.fillRect(tip-25,7.4,12,2.6);
    ctx.fillStyle='#ffd9b0';
    ctx.fillRect(tip-25,-9.4,12,.9);
    ctx.fillRect(tip-25,8,12,.9);
  }else if(b.w==='scythe'){
    if(!drawWeapon.scy){
      drawWeapon.scy=[

  }else if(b.w==='shield'){

    }
    // Same-skin (ray skin) bumps between wraps
    ctx.fillStyle='#2e2920';
    for(let i=0;i<4;i++){
      const x=s0+5.9+i*2.2;
      ctx.beginPath();ctx.arc(x,0,.55,0,7);ctx.fill();
    }

    ctx.fillStyle='#3a3228';
    ctx.beginPath();ctx.ellipse(g0-1,0,2.2,5.5,0,0,7);ctx.fill();
    ctx.strokeStyle='#c8a84e';ctx.lineWidth=.8;ctx.stroke();
    // Gold accent ring on tsuba
    ctx.strokeStyle='#d9b84e';ctx.lineWidth=.5;
    ctx.beginPath();ctx.ellipse(g0-1,0,1.4,4.2,0,0,7);ctx.stroke();

    ctx.fillStyle='#b8862a';
    ctx.fillRect(g0+1,-2.8,4,5.6);
    ctx.fillStyle='#d9a43e';
    ctx.fillRect(g0+1,-2.8,1.2,5.6);

    // --- Blade ---
    // Tanto blade: flat spine (top), straight edge until near tip, then angled upward clip
    const bladeStart=g0+5;
    const bladeLen=tip-bladeStart;
    // Clip point geometry: spine runs flat, edge angles up in last 28% to meet spine
    const clipX=bladeStart+bladeLen*.72; // where the edge angles up
    const spineY=-2.0; // flat spine offset
    const edgeY= 3.0;  // edge thickness at base

      fg.addColorStop(0,'#ffdd44');fg.addColorStop(.45,'#ff8800');fg.addColorStop(1,'#ff2200');

    // Blade outline: flat spine top, angled tip, edge bottom
    ctx.beginPath();
    ctx.moveTo(bladeStart, spineY);          // spine root
    ctx.lineTo(tip,         spineY);          // flat spine to tip
    ctx.lineTo(tip,         spineY+.5);       // tip point (very tight)

  }else if(b.w==='shuriken'){

  }else if(b.w==='bow'){

    ctx.beginPath();ctx.moveTo(bx,-L/2);ctx.quadraticCurveTo(bx+17,0,bx,L/2);ctx.stroke();
    ctx.strokeStyle='#9c6531';ctx.lineWidth=2.5;

    ctx.beginPath();ctx.moveTo(bx,-L/2);ctx.lineTo(bx-9,0);ctx.lineTo(bx,L/2);ctx.stroke();
    ctx.fillStyle='#3d2c1a';rr(bx-5,-7,12,14,4);ctx.fill();
    ctx.fillStyle='#d9a441';ctx.fillRect(bx+1,-6,3,12);

    ctx.fillStyle='#eef3f8';

  }else if(b.w==='staff'){

    ctx.lineCap='butt';

    // ── Crosspiece / binding at 60% of shaft ─────────────────────
    const bx2=s0+(shaftEnd-s0)*.6;

    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(bx2+2,-4,1,8);
    // small side prongs (crosspiece)
    ctx.strokeStyle='#c8922e';ctx.lineWidth=1.8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx2,-3.5);ctx.lineTo(bx2-1,-9);ctx.stroke();

    ctx.beginPath();ctx.moveTo(bx2, 3.5);ctx.lineTo(bx2-1, 9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx2, 3.5);ctx.lineTo(bx2+1, 9);ctx.stroke();
    ctx.lineCap='butt';

    // ── Crook / curved head ──────────────────────────────────────
    // The head is drawn in local coords at the shaft tip, then placed
    const hx=shaftEnd, hy=0;
    const CR=11; // crook curve radius
    // outer crook arc (top curve like a shepherd's crook / wizard curl)
    ctx.strokeStyle='#7a5230';ctx.lineWidth=5.5;ctx.lineCap='round';
    ctx.beginPath();
    // straight stub joining shaft to curve
    ctx.moveTo(hx-2, hy);
    ctx.lineTo(hx+3, hy);
    // curve upward and loop: quadratic making a J-curl at the top
    ctx.quadraticCurveTo(hx+CR+4, hy, hx+CR+4, hy-CR);
    ctx.quadraticCurveTo(hx+CR+4, hy-CR*2.1, hx+CR-2, hy-CR*2.1);
    ctx.quadraticCurveTo(hx+4,    hy-CR*2.1, hx+4,    hy-CR*.9);
    ctx.stroke();
    // inner lighter highlight on crook
    ctx.strokeStyle='#a07040';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hx+3.5, hy-1.5);
    ctx.quadraticCurveTo(hx+CR+1, hy-1.5, hx+CR+1, hy-CR);
    ctx.quadraticCurveTo(hx+CR+1, hy-CR*1.85, hx+CR-2.5, hy-CR*1.85);
    ctx.stroke();
    ctx.lineCap='butt';

    // ── Gem socket at the crook loop center ──────────────────────
    const gx2=hx+CR+2, gy2=hy-CR-1; // center of the crook loop
    // socket ring (gold)
    ctx.fillStyle='#c8922e';
    ctx.beginPath();ctx.arc(gx2,gy2,6.5,0,7);ctx.fill();
    ctx.fillStyle='#e8b84e';
    ctx.beginPath();ctx.arc(gx2-1.2,gy2-1.2,2.2,0,7);ctx.fill(); // shine

    // gem glow aura
    ctx.shadowColor=eCol;ctx.shadowBlur=16+Math.sin(simTime*3.5)*6;
    const gemG=ctx.createRadialGradient(gx2-.8,gy2-1,0.5,gx2,gy2,5);
    gemG.addColorStop(0,eInner);gemG.addColorStop(.55,eCol);gemG.addColorStop(1,'rgba(0,0,0,.1)');
    ctx.fillStyle=gemG;
    ctx.beginPath();ctx.arc(gx2,gy2,5,0,7);ctx.fill();

    // gem inner bright core
    ctx.shadowBlur=0;ctx.globalAlpha=.85;
    ctx.fillStyle=eInner;
    ctx.beginPath();ctx.arc(gx2-.6,gy2-.7,1.8,0,7);ctx.fill();
    ctx.globalAlpha=1;

    // orbiting energy motes around gem
    const st2=simTime*(b.mageElem===2?5.5:3.2);
    for(let oi=0;oi<2;oi++){
      const oa=st2+oi*Math.PI;
      ctx.shadowColor=eCol;ctx.shadowBlur=6;
      ctx.fillStyle=eCol;
      ctx.globalAlpha=.85;
      ctx.beginPath();ctx.arc(gx2+Math.cos(oa)*8.5,gy2+Math.sin(oa)*8.5,1.5,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;

    ctx.restore();
  }else if(b.w==='zombie'){
    const bite=b.zState===2?1-Math.max(0,b.biteLeft)/1:0;
    const grab=bite>0?Math.sin(Math.min(1,bite*1.6)*Math.PI*.5)*.55:0;
    const wig=Math.sin(simTime*3.2+(b.id||0))*.08;
    for(const sy of[-1,1]){
      ctx.save();
      ctx.rotate(sy*(1.5-wig-grab));
      ctx.translate(33+grab*4,0);
      ctx.fillStyle='#79ad68';
      ctx.beginPath();ctx.arc(0,0,4.2,0,7);ctx.fill();
      ctx.strokeStyle='#39582f';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.14)';
      ctx.beginPath();ctx.arc(-1,-1.3,1.5,0,7);ctx.fill();
      ctx.fillStyle='#e8f2df';
      const pinch=(bite>.45&&bite<.62)?-2:grab*2.2;
      for(let c=-1;c<2;c++){
        ctx.beginPath();
        ctx.moveTo(2.4,c*1.9-.8);
        ctx.quadraticCurveTo(6.5+pinch,c*2.7,8.8+pinch,c*(2.2+pinch*.8));
        ctx.lineTo(3.2,c*1.9+.6);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(40,64,32,.55)';ctx.lineWidth=.7;ctx.stroke();
      }
      ctx.restore();
    }
  }else if(b.w==='throwStar'){
    const sz=9;
    ctx.save();ctx.translate(s0+1.5,0);ctx.rotate(simTime*16);
    ctx.shadowColor='#7de3ff';ctx.shadowBlur=6;
    for(let k=0;k<4;k++){
      ctx.save();ctx.rotate(k/4*Math.PI*2);
      const bg=ctx.createLinearGradient(0,-1.2,sz,0);
      bg.addColorStop(0,'#8ca0b0');bg.addColorStop(.6,'#c0cdd8');bg.addColorStop(1,'#e8eef4');
      ctx.fillStyle=bg;
      ctx.beginPath();
      ctx.moveTo(sz*.28,-1.6);ctx.lineTo(sz,-.55);ctx.lineTo(sz+1.4,0);ctx.lineTo(sz,.55);ctx.lineTo(sz*.28,1.6);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=.5;
      ctx.beginPath();ctx.moveTo(sz*.3,-1.2);ctx.lineTo(sz,-.4);ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle='#5a6672';ctx.beginPath();ctx.arc(0,0,sz*.18,0,7);ctx.fill();
    ctx.fillStyle='#b0bcc8';ctx.beginPath();ctx.arc(0,0,sz*.09,0,7);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
  ctx.restore();
}

function drawDie(x,y,S,face,rot,alpha,glow){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(rot);
  ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
  ctx.shadowColor=glow||'#ffd76b';ctx.shadowBlur=S*.9;
  ctx.fillStyle='#f3f4f8';
  rr(-S,-S,S*2,S*2,S*.28);ctx.fill();
  ctx.strokeStyle='#c2413a';ctx.lineWidth=Math.max(1.2,S*.14);
  rr(-S,-S,S*2,S*2,S*.28);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#c2413a';
  const f=Math.max(1,Math.min(6,face|0));
  for(const ix of DIE_FACES[f-1]){
    const[px,py]=DIE_PIPS[ix];
    ctx.beginPath();ctx.arc(px*S,py*S,S*.27,0,7);ctx.fill();
  }
  ctx.restore();
}

        spawnSparks(slashFx.x+rand(-20,20),slashFx.y+rand(-20,20),'#a8d8ff',5,180);
        sfx('katSlash');
      }
      slashFx.shown++;
    }
    // Draw slash marks — position follows victim while alive
    const vx=slashFx.victim.alive?slashFx.victim.x:slashFx.x;
    const vy=slashFx.victim.alive?slashFx.victim.y:slashFx.y;
    ctx.save();ctx.translate(vx,vy);
    const gFade=Math.max(0,Math.min(1,slashFx.t/.22));
    slashFx.marks.forEach((m,i)=>{
      const slashTime=startDelay+i*interval;
      const ai=(elapsed-slashTime)*7;
      if(ai<=0)return;
      const fade=Math.min(1,ai)*gFade;
      if(fade<=0)return;
      ctx.globalAlpha=fade;
      const L=slashFx.r*(1.6+i*.04),off=m.off*slashFx.r;
      const ca=Math.cos(m.a),sa=Math.sin(m.a);
      // Alternating white/cyan slashes, with every 3rd being gold
      const col=i%3===2?'#ffd76b':i%2?'#e8f4ff':'#7de3ff';
      ctx.strokeStyle=col;
      ctx.lineWidth=2.5+i*.12;ctx.shadowColor=col;ctx.shadowBlur=14;
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-ca*L-sa*off,-sa*L+ca*off);
      ctx.lineTo(ca*L-sa*off,sa*L+ca*off);ctx.stroke();
    });
    ctx.restore();ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineCap='butt';
    // Never let the freeze outlast the slash sequence - time resumes when it ends
    hitstop=Math.min(hitstop,Math.max(0,slashFx.t));
    if(slashFx.t<=0){slashFx=null;hitstop=Math.min(hitstop,.01);}
  }

  for(let i=stabs.length-1;i>=0;i--){
    const s=stabs[i];s.t-=rdt;
    if(s.t<=0){stabs.splice(i,1);continue;}
    const v=balls.find(q=>q.id===s.eid);
    const ex=v?v.x:s.x,ey=v?v.y:s.y;
    const p=1-s.t/s.max;
    const bx=ex-Math.cos(s.ang)*s.len,by=ey-Math.sin(s.ang)*s.len;
    const ins=s.len*(.25+Math.min(1,p*1.5)*.75);
    const gx=bx+Math.cos(s.ang)*s.len*.34,gy=by+Math.sin(s.ang)*s.len*.34;
    ctx.lineCap='round';
    ctx.strokeStyle='#33383f';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(gx,gy);ctx.stroke();
    ctx.strokeStyle='#c9a6ff';ctx.lineWidth=3.2;ctx.shadowColor='#c9a6ff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(bx+Math.cos(s.ang)*ins,by+Math.sin(s.ang)*ins);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#8b93a0';ctx.lineWidth=3;
    const pxp=-Math.sin(s.ang),pyp=Math.cos(s.ang);
    ctx.beginPath();ctx.moveTo(gx-pxp*7,gy-pyp*7);ctx.lineTo(gx+pxp*7,gy+pyp*7);ctx.stroke();
    if(p>.55){
      ctx.globalAlpha=(p-.55)/.45*.9;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(ex-Math.cos(s.ang)*5,ey-Math.sin(s.ang)*5,3+p*9,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.lineCap='butt';
  }

  for(const so of souls){
    const v=balls.find(q=>q.id===so.eid);
    const col=v?v.color:'#c084fc';
    const pu=Math.sin(simTime*5)*.05+1;
    const g=so.born!==undefined?Math.min(1,(simTime-so.born)*2.6):1;
    const gr=(.25+.75*g)*(g<1?1+Math.sin(g*Math.PI)*.3:1);
    const R=so.r*gr;
    if(v){
      ctx.globalAlpha=.13+.05*Math.sin(simTime*3.1);
      ctx.strokeStyle='#c084fc';ctx.lineWidth=1.5;
      ctx.setLineDash([5,6]);
      ctx.beginPath();ctx.moveTo(so.x,so.y);ctx.lineTo(v.x,v.y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha=1;
    }
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.14*pu*gr;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(so.x,so.y+R*.2,R*1.55,0,7);ctx.fill();
    const fl=(hm,hw,sd,c,a)=>{
      const tipX=so.x+Math.sin(simTime*6.3+sd)*hw*.4*R+Math.sin(simTime*2.7+sd*1.7)*hw*.22*R;
      const tipY=so.y-R*hm;
      const cpY=tipY+(so.y-tipY)*.42;
      ctx.globalAlpha=a*pu;
      ctx.fillStyle=c;
      ctx.beginPath();
      ctx.moveTo(so.x,so.y+R*.62);
      ctx.bezierCurveTo(so.x-hw*R,so.y+R*.34,so.x-hw*.78*R,cpY,tipX,tipY);
      ctx.bezierCurveTo(so.x+hw*.78*R,cpY,so.x+hw*R,so.y+R*.34,so.x,so.y+R*.62);
      ctx.fill();
    };
    fl(2.15,1.02,0,'#a855f7',.17);
    fl(1.82,.84,2.1,'#c084fc',.27);
    fl(1.52,.63,4.2,'#e9d5ff',.4);
    fl(1.18,.41,1.3,'#fff7fd',.62);
    ctx.globalAlpha=.85*gr;
    ctx.fillStyle='#fdfaff';
    ctx.beginPath();ctx.arc(so.x,so.y+R*.12,R*.28*pu,0,7);ctx.fill();
    for(let k=0;k<5;k++){
      const ph=(simTime*(.5+k*.13)+k*2.51)%1;
      const ex=so.x+Math.sin(simTime*3+k*2.2)*R*(.55-ph*.4)+Math.sin(k*9.7)*R*.22;
      const ey=so.y-R*(.35+ph*2.3);
      ctx.globalAlpha=(1-ph)*.45*gr;
      ctx.fillStyle=k%2?'#e9d5ff':'#c084fc';
      ctx.beginPath();ctx.arc(ex,ey,1.5+k*.25,0,7);ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  // Draw pickups (ingredients and sushi bombs)
  const ING_COLORS={salmon:'#ff7766',avocado:'#6dba5b',rice:'#f0f0e0',wasabi:'#3dcf6e'};
  const ING_EMOJI={salmon:'🐟',avocado:'🥑',rice:'🍚',wasabi:'🌿'};
  for(const pk of pickups){
    ctx.save();
    ctx.translate(pk.x,pk.y);
    if(pk.kind==='ing'){
      const bob=Math.sin(simTime*3+pk.x)*.8;
      ctx.translate(0,bob);
      const col=ING_COLORS[pk.sub]||'#ffd76b';
      ctx.shadowColor=col;ctx.shadowBlur=12;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(0,0,pk.r,0,7);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,pk.r,0,7);ctx.stroke();
      // ingredient icon text
      ctx.font=`${pk.r*1.3}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ING_EMOJI[pk.sub]||'★',0,1);
      ctx.textBaseline='alphabetic';
    }else if(pk.kind==='sushi'){
      // Fire sushi bomb
      const fade=pk.life/pk.max;
      ctx.globalAlpha=fade;
      const spin=simTime*4+pk.x;
      ctx.rotate(spin);
      // Fire glow
      const fg=simTime*5;
      ctx.shadowColor='#ff6a00';ctx.shadowBlur=14+Math.sin(fg)*5;
      // Sushi roll
      ctx.fillStyle='#f0f0e8';
      ctx.beginPath();ctx.ellipse(0,0,pk.r,pk.r*.72,0,0,7);ctx.fill();
      // Nori band
      ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-pk.r,0);ctx.lineTo(pk.r,0);ctx.stroke();
      // Salmon topping
      ctx.fillStyle='#ff8866';
      ctx.beginPath();ctx.ellipse(0,-2,pk.r*.6,pk.r*.32,0,0,7);ctx.fill();
      // Flames on top
      for(let k=0;k<3;k++){
        const fa=simTime*7+k*2.1;
        ctx.fillStyle=k%2?'#ffee00':'#ff6600';
        ctx.globalAlpha=fade*(.5+Math.sin(fa)*.3);
        ctx.beginPath();
        ctx.arc(Math.sin(fa)*pk.r*.4,-pk.r*.7+Math.sin(fa+1)*2,2.5,0,7);
        ctx.fill();
      }
      ctx.globalAlpha=fade;
      ctx.shadowBlur=0;
    }
    ctx.restore();
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  ctx.font='700 13px Segoe UI,sans-serif';ctx.textAlign='center';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,f.life/.9);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;

if(state!=='menu')drawHUD(rdt);
  if(state==='fight'&&(countdown>0||cdFightT>0))drawCount();
}

function drawCount(){
  const showFight=cdFightT>0;
  const txt=showFight?'FIGHT!':String(Math.ceil(Math.max(countdown,0)));

  ctx.save();

  else{const pp=countdown-Math.floor(countdown);sc=1+.9*Math.pow(Math.max(0,1-pp),3);}
  ctx.scale(sc*Math.max(.5,sc),sc*Math.max(.5,sc));

ctx.fillStyle=showFight?'#fff':'#d9ffe0';

function burnFx(b){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.15+.06*Math.sin(simTime*9+b.id);
  ctx.fillStyle='#ff7b2a';
  ctx.beginPath();ctx.arc(b.x,b.y+b.r*.12,b.r*1.42,0,7);ctx.fill();
  const tongue=(ht,wd,sd,col,al)=>{
    const tx=b.x+Math.sin(simTime*6.5+sd)*wd*.55*b.r;
    const ty=b.y-b.r*ht*(.92+.08*Math.sin(simTime*10+sd*2.3));
    const cy=ty+(b.y-ty)*.45;
    ctx.globalAlpha=al*(.85+.15*Math.sin(simTime*13+sd));
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y+b.r*.58);
    ctx.bezierCurveTo(b.x-wd*b.r,b.y+b.r*.22,b.x-wd*.72*b.r,cy,tx,ty);
    ctx.bezierCurveTo(b.x+wd*.72*b.r,cy,b.x+wd*b.r,b.y+b.r*.22,b.x,b.y+b.r*.58);
    ctx.fill();
  };
  tongue(2.0,.95,.4,'#ff5a00',.22);
  tongue(1.62,.68,2.5,'#ff9d3c',.30);
  tongue(1.18,.40,4.6,'#ffe27a',.42);
  for(let k=0;k<4;k++){
    const ph=(simTime*(.65+k*.16)+k*2.4)%1;
    const ex=b.x+Math.sin(simTime*4+k*2.6)*b.r*(.6-ph*.35);
    const ey=b.y-b.r*(.35+ph*1.9);
    ctx.globalAlpha=(1-ph)*.5;
    ctx.fillStyle=k%2?'#ffd76b':'#ff884d';
    ctx.beginPath();ctx.arc(ex,ey,1.6+k*.3,0,7);ctx.fill();
  }
  ctx.restore();
}
function incText(b){
  switch(b.w){

      return tt('ING ','INGR ')+ic+'/4 \u00b7 '+upg+(b.fiery?' \uD83D\uDD25':'')+' \u00b7 '+tt('NEXT IN ','PROSSIMI TRA ')+Math.max(0,b.sushiT).toFixed(1)+'s';

    }
    case 'bow':return b.chargeState===0?(tt('ARROWS \u00d7','FRECCE \u00d7')+(b.stacks+1)+' \u00b7 '+tt('POWER IN ','POWER TRA ')+Math.max(0,b.chargeT).toFixed(1)+'s'):(tt('POWER SHOT ','POWER SHOT ')+(b.stacks*2)+tt(' DMG...',' DMG...'));

      return ENAMES[b.mageElem||0]+' \u00b7 '+tt('DMG ','DMG ')+(.5+(b.dmgBonus||0)).toFixed(1)+' \u00b7 '+tt('STATUS ','STATUS ')+(Math.round((b.mageStatusChance||0)*100))+'% \u00b7 '+tt('SHIFT IN ','CAMBIO TRA ')+Math.max(0,b.mageShiftT||0).toFixed(1)+'s';
    }
    case 'zombie':{
      if(b.zMini)return b.zLatch?'\uD83E\uDDBF':(b.zState===1?tt('\uD83E\uDDA0 SEEKING','\uD83E\uDDA0 IN CACCIA'):'\uD83E\uDDA0 '+Math.max(0,Math.round(b.hp))+' HP');
      const hn=10+(b.zExtra||0);
      const zs=b.zState===1?tt('SEEKING!','IN CACCIA!'):b.zState===2?tt('BITING!','MORDO!'):b.zState===3?tt('RETREATING','INDIETREGGIO'):'';
      return (zs?zs+' \u00b7 ':'')+tt('ZOMBIE HORDE \u00d7','ORDA ZOMBIE \u00d7')+hn+' \u00b7 '+tt('NEXT IN ','PROSSIMA TRA ')+Math.max(0,b.hordeT).toFixed(1)+'s';
    }
    case 'throwStar':{
      if(b.njHidden)return tt('HIDDEN! \u00b7 REAPPEARING...','NASCOSTO! \u00b7 RIAPPARENDO...')+' '+Math.max(0,b.njHideLeft).toFixed(1)+'s';
      return tt('STACKS \u00d7','STACK \u00d7')+b.njStacks+' \u00b7 '+tt('MAX BOUNCE \u00d7','RIMBALZO MAX \u00d7')+b.njMaxBounce+' \u00b7 '+tt('SKILL IN ','SKILL TRA ')+Math.max(0,b.njSkillT).toFixed(1)+'s';
    }
  }
}
function drawHUD(rdt){
  const bw=Math.min((W-MARGIN*2)*.38,460),bh=20,topY=AR.b+16;
  const cw=bw+40,ch=108;
  for(let s=0;s<2;s++){
    const b=balls[s];if(!b)continue;
    const left=s===0;
    const cx=left?MARGIN+8:W-MARGIN-8-cw;
    const bx=left?cx+20:cx+20;
    const tx=left?bx:bx+bw;
    if(b.hpGhost===undefined||b.hp>b.hpGhost)b.hpGhost=b.hp;
    b.hpGhost+=(Math.max(0,b.hp)-b.hpGhost)*Math.min(1,(rdt||.016)*3.2);
    const cg=ctx.createLinearGradient(0,topY-6,0,topY-6+ch);
    cg.addColorStop(0,'rgba(13,17,27,.88)');cg.addColorStop(1,'rgba(8,11,18,.66)');
    ctx.fillStyle=cg;rr(cx,topY-6,cw,ch,12);ctx.fill();
    ctx.strokeStyle=hexA(b.color,.4);ctx.lineWidth=1;rr(cx,topY-6,cw,ch,12);ctx.stroke();
    ctx.fillStyle=hexA(b.color,.55);rr(cx+14,topY-6,cw-28,3,1.5);ctx.fill();
    const chipY=topY+6,chipW=34;
    const chx=left?cx+14:cx+cw-14-chipW;
    ctx.fillStyle=b.color;rr(chx,chipY,chipW,19,9);ctx.fill();
    ctx.fillStyle='#0b0e14';ctx.font='800 12px Segoe UI,sans-serif';ctx.textAlign='center';
    ctx.fillText('P'+(s+1),chx+chipW/2,chipY+14);
    ctx.font='800 17px Segoe UI,sans-serif';ctx.fillStyle='#eef4ff';ctx.textAlign=left?'left':'right';
    ctx.fillText(b.def.name.toUpperCase(),left?chx+chipW+9:chx-9,chipY+15);
    const pct=Math.max(0,b.hp/b.maxHp),gp=Math.max(pct,Math.min(1,b.hpGhost/b.maxHp));
    ctx.fillStyle='rgba(0,0,0,.6)';rr(bx,topY+32,bw,bh,7);ctx.fill();
    if(gp>pct+.005){ctx.fillStyle='rgba(255,120,90,.42)';rr(bx+2,topY+34,(bw-4)*gp,bh-4,5);ctx.fill();}
    const hue=pct*112;
    if(pct<.25){ctx.shadowColor='rgba(255,60,60,.8)';ctx.shadowBlur=12+6*Math.sin(simTime*9);}
    const hg=ctx.createLinearGradient(bx,topY+34,bx,topY+34+bh-4);
    hg.addColorStop(0,'hsl('+hue+',80%,58%)');
    hg.addColorStop(1,'hsl('+hue+',75%,38%)');
    ctx.fillStyle=hg;rr(bx+2,topY+34,(bw-4)*pct,bh-4,5);ctx.fill();

function snapVal(v,d){
  if(d>40)return v===null?null:undefined;
  if(v===null||v===undefined)return v;
  const t=typeof v;
  if(t==='number'||t==='boolean'||t==='string')return v;
  if(t==='function')return undefined;
  if(Array.isArray(v)){const a=[];for(let i=0;i<v.length;i++){const e=snapVal(v[i],d+1);if(e!==undefined)a.push(e);}return a;}
  if(t==='object'){const o={};for(const k in v){if(k==='def'||k==='prototype')continue;const e=snapVal(v[k],d+1);if(e!==undefined)o[k]=e;}return o;}
  return undefined;
}
function setDefs(o){
  if(Array.isArray(o)){for(let i=0;i<o.length;i++)setDefs(o[i]);return;}
  if(o&&typeof o==='object'){
    if(typeof o.w==='string'&&WEAPONS[o.w]&&!o.def)o.def=WEAPONS[o.w];
    for(const k in o){if(k==='def')continue;const v=o[k];if(v&&typeof v==='object')setDefs(v);}
  }
}
function recordSnap(){
  while(replayBuf.length>=(REPLAY_SEC+POST_SEC)*REPLAY_FPS)replayBuf.shift();
  replayBuf.push({t:simTime,shake,
    balls:snapVal(balls,0),projectiles:snapVal(projectiles,0),particles:snapVal(particles,0),
    floaters:snapVal(floaters,0),rings:snapVal(rings,0),bolts:snapVal(bolts,0),beams:snapVal(beams,0),
    slashFx:snapVal(slashFx,0),stabs:snapVal(stabs,0),souls:snapVal(souls,0),pickups:snapVal(pickups,0),smokes:snapVal(smokes,0),
    impales:snapVal(impales,0)});
}
function applyReplay(p){
  const s=replayBuf[p];if(!s)return;
  simTime=s.t;shake=s.shake||0;
  balls=s.balls||[];projectiles=s.projectiles||[];particles=s.particles||[];floaters=s.floaters||[];rings=s.rings||[];
  bolts=s.bolts||[];beams=s.beams||[];slashFx=s.slashFx||null;stabs=s.stabs||[];souls=s.souls||[];pickups=s.pickups||[];
smokes=s.smokes||[];impales=s.impales||[];
  setDefs(balls);setDefs(projectiles);setDefs(particles);setDefs(floaters);setDefs(rings);setDefs(bolts);
  setDefs(beams);setDefs(slashFx);setDefs(stabs);setDefs(souls);setDefs(pickups);setDefs(smokes);
  setDefs(impales);
}
function startReplay(){
  const start=Math.max(0,replayDeath-REPLAY_SEC*REPLAY_FPS);
  replayLast=Math.min(replayBuf.length,replayDeath+POST_SEC*REPLAY_FPS);
  if(replayLast<8||start>=replayLast)return false;
  replayMode=true;replayFirst=true;
  replayI=start;
  state='end';targetTS=1;
  document.getElementById('replayBar').classList.remove('hidden');
  return true;
}
function beginKillcam(){
  killcamDone=false;endPending=false;
  if(!startReplay())finishKillcam();
}
function replayStep(rdt){
  const p=Math.floor(replayI);
  if(p>=replayLast){finishKillcam();return;}
  applyReplay(p);
  const rem=replayLast-p;
  const sp=rem<=slowFrames()?0.22:1.0;
  replayI+=rdt*REPLAY_FPS*sp;
}
function slowFrames(){return Math.min(replayLast,Math.round(REPLAY_FPS*.6));}
function watchReplayAgain(){
  if(!replayBuf.length)return;
  killcamDone=false;replayFromWin=true;
  document.getElementById('end').classList.add('hidden');
  if(!startReplay()){replayFromWin=false;document.getElementById('end').classList.remove('hidden');}
}
function finishKillcam(){
  if(killcamDone)return;killcamDone=true;
  replayMode=false;
  document.getElementById('replayBar').classList.add('hidden');
  if(replayFromWin){replayFromWin=false;document.getElementById('end').classList.remove('hidden');return;}
  showEnd();
}

function drawPreview(p,idx){
  const c=document.getElementById('prev'+p),pc=c.getContext('2d');
  const mystery=sel[p]<0&&(idx===undefined||idx<0);
  const key=KEYS[idx!==undefined&&idx>=0?idx:sel[p]];
  const col=p===0?P1C:P2C;
  const old=ctx;ctx=pc;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);
  ctx.translate(c.width/2,c.height/2+10);
  ctx.shadowColor=col;ctx.shadowBlur=16;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();
  ctx.shadowBlur=0;
  const g=ctx.createRadialGradient(-8,-10,2,0,0,24);
  g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();
  if(mystery){
    ctx.globalAlpha=.4;
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.font='900 36px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.shadowColor=col;ctx.shadowBlur=14;
    ctx.fillText('\u003F',0,3);
    ctx.shadowBlur=0;
  }else{
    drawWeapon({x:0,y:0,r:24,ang:-Math.PI/3.2,w:key,def:WEAPONS[key],lenMul:1});
  }
  ctx=old;
}
let pickPhase=0,rolling=false;
function rollPick(p){
  const other=sel[1-p];
  if(KEYS.length>1&&other>=0&&other<KEYS.length){
    let i=Math.floor(Math.random()*(KEYS.length-1));
    if(i>=other)i++;
    return i;
  }
  return Math.floor(Math.random()*KEYS.length);
}
function buildGrid(){
  const g=document.getElementById('tkGrid');
  const cells=KEYS.map((k,i)=>({k,i})).concat([{random:true}]);
  g.innerHTML=cells.map(c=>c.random
    ?'<div class="tkCell random" data-r="1" title="Random"><canvas width="44" height="44"></canvas><span class="tag">?</span></div>'
    :`<div class="tkCell" data-i="${c.i}"><canvas width="44" height="44"></canvas><span class="tag">${WEAPONS[c.k].name.toUpperCase()}</span></div>`).join('');
  g.querySelectorAll('.tkCell').forEach(cell=>{
    const pc=cell.querySelector('canvas').getContext('2d');
    const old=ctx;ctx=pc;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,44,44);
    if(cell.dataset.r){
      ctx.font='700 30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#7d5dff';ctx.fillText('\u2753',22,23);
    }else{
      const i=+cell.dataset.i,key=KEYS[i];
      ctx.translate(22,23);
      ctx.shadowColor='#fff';ctx.shadowBlur=8;
      ctx.fillStyle='#e9eef7';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();
      ctx.shadowBlur=0;
      const gg=ctx.createRadialGradient(-4,-5,2,0,0,12);
      gg.addColorStop(0,'rgba(255,255,255,.45)');gg.addColorStop(1,'rgba(0,0,0,.3)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();
      drawWeapon({x:0,y:0,r:12,ang:-Math.PI/3.2,w:key,def:WEAPONS[key],lenMul:1});

function drawGlitch(el){
  el.innerHTML='';
  const w=el.offsetWidth||window.innerWidth,h=el.offsetHeight||window.innerHeight;
  const n=7+Math.floor(Math.random()*7);
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='gSlice';
    const sh=Math.random()*h*.2+6;
    const y=Math.random()*h;
    s.style.cssText='top:'+y+'px;height:'+sh+'px;opacity:'+(0.5+Math.random()*.5)+';background:rgba('+
      (Math.random()>.5?'51,255,85':'200,220,255')+','+(0.08+Math.random()*.2)+');'+
      'transform:translateX('+(Math.random()*60-30)+'px);';
    el.appendChild(s);
  }
  el.style.transform='translateX('+(Math.random()*14-7)+'px)';
}
function glitchFx(el,cb){
  el.classList.remove('on');void el.offsetWidth;
  drawGlitch(el);
  el.classList.add('on');
  if(cb)cb();
  const iv=setInterval(()=>drawGlitch(el),50);
  setTimeout(()=>{clearInterval(iv);el.classList.remove('on');el.style.transform='';el.innerHTML='';},350);
}

(function(){

  p.addEventListener('mousemove',e=>{
    const r=p.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const rx=(e.clientX-cx)/(r.width/2);
    const ry=(e.clientY-cy)/(r.height/2);
    const mx=Math.max(-1,Math.min(1,rx)),my=Math.max(-1,Math.min(1,ry));
    const maxT=14;
    p.style.transform='rotateY('+(mx*maxT)+'deg) rotateX('+(-my*maxT)+'deg)';
  });
  p.addEventListener('mouseleave',()=>{p.style.transform='none';});
})();

  if(!rands.length){rolling=false;startBtn.disabled=false;launch();return;}
  const dur=2000,t0=performance.now();let lastTick=0;
  (function tick(now){
    const t=now-t0;
    if(now-lastTick>140){lastTick=now;uiBeep(400+Math.random()*900,.03,'square',.025,900);}
    for(const p of rands){
      const r=Math.floor(Math.random()*KEYS.length);
      drawPreview(p,r);
      document.getElementById('wname'+p).textContent=WEAPONS[KEYS[r]].name.toUpperCase();
      document.getElementById('sd'+p).textContent=T('rolling');
    }
    if(t<dur)requestAnimationFrame(tick);
    else{
      for(const p of rands)sel[p]=rollPick(p);
      refreshSelect();
      setTimeout(launch,1000);
    }
  })(performance.now());
});

setInterval(()=>{
  const mm=menuMusicEl();if(!mm)return;

  if(du&&mm.duration>0&&isFinite(mm.duration))du.textContent=fmtT(mm.duration);

    const v=Math.round(mm.currentTime/mm.duration*1000);

(function(){
  const t=document.querySelector('.panel.wide');
  t.addEventListener('mousemove',e=>{
    const r=t.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const rx=(e.clientX-cx)/(r.width/2);
    const ry=(e.clientY-cy)/(r.height/2);
    const mx=Math.max(-1,Math.min(1,rx)),my=Math.max(-1,Math.min(1,ry));
    const maxT=10;
    t.style.transform='rotateY('+(mx*maxT)+'deg) rotateX('+(-my*maxT)+'deg)';
  });
  t.addEventListener('mouseleave',()=>{t.style.transform='none';});
})();
const _tStart=performance.now();
(function tick(){
  const d=performance.now()-_tStart;
  const ms=Math.floor(d/10)%100,sc=Math.floor(d/1000)%60,mn=Math.floor(d/60000)%60,hr=Math.floor(d/3600000);
  document.getElementById('timer').textContent=
    String(hr).padStart(2,'0')+':'+String(mn).padStart(2,'0')+':'+String(sc).padStart(2,'0')+':'+String(ms).padStart(2,'0');
  requestAnimationFrame(tick);
})();
